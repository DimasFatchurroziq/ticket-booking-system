version: "2"

sql:

  - engine: "postgresql"

    schema:
      - "../migrations"

    queries:
      - "../internal/booking/repository/queries"

    gen:
      go:
        package: "db"

        out: "../internal/booking/repository/db"

        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_empty_slices: true

        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"